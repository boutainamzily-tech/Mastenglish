<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - Mastenglish.ma</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #1e3c72;
            background-image: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .auth-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .auth-container h2 {
            color: #1e3c72;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .auth-container p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: right;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #1e3c72;
        }

        .auth-btn {
            width: 100%;
            padding: 12px;
            background-color: #ffcc00;
            color: #1e3c72;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
            margin-top: 10px;
        }

        .auth-btn:hover {
            background-color: #e6b800;
            transform: translateY(-2px);
        }

        .switch-text {
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .switch-text a {
            color: #1e3c72;
            text-decoration: none;
            font-weight: 600;
        }

        .switch-text a:hover {
            text-decoration: underline;
        }

        .back-home {
            display: inline-block;
            margin-top: 15px;
            color: #888;
            font-size: 13px;
            text-decoration: none;
        }

        .back-home:hover {
            color: #1e3c72;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <h2>Mastenglish.ma</h2>
        <p>مرحباً بك في أكلاديميتنا لتعلم الإنجليزية</p>

        <!-- نموذج تسجيل الدخول -->
        <form id="loginForm">
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" placeholder="********" required>
            </div>
            <button type="submit" class="auth-btn">تسجيل الدخول</button>
            <div class="switch-text">
    <a href="forgot-password.html">نسيت كلمة المرور؟</a>
</div>
            <div class="switch-text">
                ليس لديك حساب؟ <a href="#" onclick="toggleForm()">إنشاء حساب جديد</a>
            </div>
        </form>

        <!-- نموذج إنشاء حساب (مخفي مؤقتاً حتى يتم التبديل) -->
        <form id="signupForm" style="display: none;">
            <div class="form-group">
                <label>الاسم الكامل</label>
                <input type="text" placeholder="أدخل اسمك الكامل" required>
            </div>
            <div class="form-group">
                <label>البريد الإلكتروني</label>
                <input type="email" placeholder="name@example.com" required>
            </div>
            <div class="form-group">
                <label>كلمة المرور</label>
                <input type="password" placeholder="********" required>
            </div>
            <button type="submit" class="auth-btn">إنشاء الحساب</button>
            <div class="switch-text">
                لديك حساب بالفعل؟ <a href="#" onclick="toggleForm()">تسجيل الدخول</a>
            </div>
        </form>

        <a href="index.html" class="back-home">← العودة إلى الصفحة الرئيسية</a>
    </div>

    <script>
        function toggleForm() {
            event.preventDefault();
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            
            if (loginForm.style.display === 'none') {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
            } else {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
            }
        }
        async function submitAccount(url, account) {
    const response = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(account)
    });

    const data = await response.json();
    if (!response.ok) {
        throw new Error(data.error || 'وقع مشكل، عاودي المحاولة');
    }

    window.location.href = 'index.html';
}

document.getElementById('signupForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const inputs = this.querySelectorAll('input');
    const button = this.querySelector('button[type="submit"]');

    button.disabled = true;
    try {
        await submitAccount('/auth/register', {
            name: inputs[0].value.trim(),
            email: inputs[1].value.trim(),
            password: inputs[2].value
        });
    } catch (error) {
        alert(error.message);
        button.disabled = false;
    }
});

document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();
    const inputs = this.querySelectorAll('input');
    const button = this.querySelector('button[type="submit"]');

    button.disabled = true;
    try {
        await submitAccount('/auth/login', {
            email: inputs[0].value.trim(),
            password: inputs[1].value
        });
    } catch (error) {
        alert(error.message);
        button.disabled = false;
    }
});
    </script>

</body>
</html>
