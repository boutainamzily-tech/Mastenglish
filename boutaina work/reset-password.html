<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>كلمة مرور جديدة - Mastenglish.ma</title>
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #1e3c72;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #222;
    }

    main {
      width: 100%;
      max-width: 440px;
      padding: 28px;
      background: white;
      border-radius: 15px;
    }

    h1 { color: #1e3c72; font-size: 25px; }
    p { line-height: 1.8; }

    label {
      display: block;
      margin: 18px 0 8px;
    }

    input, button {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      font: inherit;
    }

    input { border: 1px solid #bbb; }

    button {
      margin-top: 22px;
      border: 0;
      background: #ffcc00;
      color: #1e3c72;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }
    a { color: #1e3c72; }
    #message { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h1>اختار كلمة مرور جديدة</h1>
    <p id="message" role="status" aria-live="polite"></p>

    <form id="resetForm" hidden>
      <p>استعمل 8 حروف على الأقل، واختار كلمة مرور خاصة بحسابك.</p>

      <label for="newPassword">كلمة المرور الجديدة</label>
      <input id="newPassword" type="password"
             autocomplete="new-password" minlength="8" required>

      <label for="confirmPassword">تأكيد كلمة المرور</label>
      <input id="confirmPassword" type="password"
             autocomplete="new-password" minlength="8" required>

      <button id="saveButton" type="submit">
        حفظ كلمة المرور الجديدة
      </button>
    </form>

    <p><a href="login.html">العودة لتسجيل الدخول</a></p>
  </main>

  <script>
    const form = document.getElementById('resetForm');
    const message = document.getElementById('message');
    const button = document.getElementById('saveButton');

    let token = new URLSearchParams(
      window.location.hash.slice(1)
    ).get('token') || '';

    // نحيدو الرمز من شريط العنوان ونحتافظو به غير فهاد الصفحة.
    history.replaceState(null, '', window.location.pathname);

    if (/^[a-f0-9]{64}$/.test(token)) {
      form.hidden = false;
    } else {
      message.textContent =
        'خاصك تفتح الرابط اللي وصلك فالإيميل. إلا انتهت صلاحيته، طلب رابطاً جديداً من تسجيل الدخول.';
      token = '';
    }

    form.addEventListener('submit', async event => {
      event.preventDefault();

      const password = document.getElementById('newPassword').value;
      const confirmation =
        document.getElementById('confirmPassword').value;

      if (password.length < 8 ||
          new TextEncoder().encode(password).length > 72) {
        message.textContent =
          'كلمة المرور خاصها 8 حروف على الأقل. إلا كانت طويلة بزاف، قصّرها.';
        return;
      }

      if (password !== confirmation) {
        message.textContent = 'تأكيد كلمة المرور ما مطابقش.';
        return;
      }

      button.disabled = true;
      message.textContent = 'جاري حفظ كلمة المرور...';

      try {
        const response = await fetch('/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token,
            password,
            password_confirmation: confirmation
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'تعذر تغيير كلمة المرور.');
        }

        token = '';
        form.reset();
        form.hidden = true;
        message.textContent =
          'تبدّلات كلمة المرور بنجاح. اضغط على «العودة لتسجيل الدخول» واستعمل الكلمة الجديدة.';
      } catch (error) {
        message.textContent =
          error.message || 'تعذر الاتصال بالسيرفر. عاود المحاولة.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
