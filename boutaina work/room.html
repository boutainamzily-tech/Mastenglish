<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>قاعة الدرس المباشر - Mastenglish.ma</title>
    <script>
  if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    window.location.replace('mobile-room.html');
  }
</script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 0;
            direction: rtl;
            text-align: right;
        }
        .header {
            background-color: #1e3a8a;
            color: white;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .room-title {
            font-size: 24px;
            color: #1e3a8a;
            margin-bottom: 10px;
        }
        .room-desc {
            color: #555;
            margin-bottom: 25px;
        }
        .video-box {
            width: 100%;
            height: 400px;
            background-color: #000;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            margin-bottom: 20px;
        }
        .join-btn {
            display: inline-block;
            background-color: #10b981;
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
        }
        .join-btn:hover {
            background-color: #0e9f6e;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Mastenglish.ma - قاعة الدرس</h1>
    </div>

    <div class="container">
        <div class="room-title">مرحباً بك في حصتك المباشرة</div>
        <div class="room-desc">هنا ستلتقي بالأستاذة لبدء الدرس والتفاعل المباشر. يرجى الضغط على الزر أسفله في موعد الحصة للدخول إلى القاعة.</div>
<div id="zmmtg-root" class="video-box">
    قاعة الدرس المباشر ستفتح هنا
</div>

        <!-- hna kathi l-link dial Google Meet wla Zoom dyalk -->
<a href="#" class="join-btn">دخول إلى قاعة Zoom المباشرة</a>
    </div>
    <!-- Zoom Meeting SDK -->
<script src="https://source.zoom.us/6.5.0/lib/vendor/react.min.js"></script>
<script src="https://source.zoom.us/6.5.0/lib/vendor/react-dom.min.js"></script>
<script src="https://source.zoom.us/6.5.0/lib/vendor/redux.min.js"></script>
<script src="https://source.zoom.us/6.5.0/lib/vendor/redux-thunk.min.js"></script>
<script src="https://source.zoom.us/6.5.0/lib/vendor/lodash.min.js"></script>

<script src="https://source.zoom.us/zoom-meeting-embedded-6.5.0.min.js"></script>

    <script>
    

    const client = ZoomMtgEmbedded.createClient();

    async function joinMeeting() {
        try {
                    const studentName = prompt('كتب سميتك باش تدخل للحصة:')?.trim();
        if (!studentName) return;
            const response = await fetch('/zoom-signature', {
    method: 'POST',
    headers: {
        'Content-Type': 'application/json'
    },
    body: JSON.stringify({})
});

const data = await response.json();

if (!response.ok) {
    throw new Error(data.error || 'تعذر الدخول للحصة');
}


            const meetingSDKElement =
                document.getElementById('zmmtg-root');

            await client.init({
                zoomAppRoot: meetingSDKElement,
                language: 'en-US',
                patchJsMedia: true
            });

            await client.join({
                signature: data.signature,
               meetingNumber: data.meetingNumber,
password: data.password,
                userName: studentName
            });

            console.log("Joined Zoom meeting");

        } catch (error) {
            console.error("Zoom error:", error);
            alert(error.message || 'وقع مشكل فالدخول للحصة');
        }
    }

    document.querySelector('.join-btn').addEventListener('click', function(e) {
        e.preventDefault();
        joinMeeting();
    });
</script>
</body>
</html>
