<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>استرجاع كلمة المرور - Mastenglish.ma</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #1e3c72;
      color: #222;
    }

    main {
      width: 100%;
      max-width: 440px;
      padding: 28px;
      background: white;
      border-radius: 15px;
    }

    h1 {
      color: #1e3c72;
      font-size: 25px;
    }

    p { line-height: 1.8; }

    label {
      display: block;
      margin: 18px 0 8px;
    }

    input, button {
      width: 100%;
      padding: 13px;
      border-radius: 8px;
      font: inherit;
    }

    input {
      border: 1px solid #bbb;
      direction: ltr;
      text-align: left;
    }

    button {
      margin-top: 20px;
      border: 0;
      background: #ffcc00;
      color: #1e3c72;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    a { color: #1e3c72; }
    #message { overflow-wrap: anywhere; }
  </style>
</head>

<body>
  <main>
    <h1>نسيت كلمة المرور؟</h1>
    <p>كتب البريد الإلكتروني اللي تسجّلتي به فالموقع.</p>

    <form id="forgotForm">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" type="email" autocomplete="email"
             placeholder="name@example.com"
             maxlength="254" required>

      <button id="sendButton" type="submit">
        إرسال رابط الاسترجاع
      </button>
    </form>

    <p id="message" role="status" aria-live="polite"></p>
    <p><a href="login.html">العودة لتسجيل الدخول</a></p>
  </main>

  <script>
    const form = document.getElementById('forgotForm');
    const button = document.getElementById('sendButton');
    const message = document.getElementById('message');
    let retryAt = 0;

    form.addEventListener('submit', async event => {
      event.preventDefault();

      if (Date.now() < retryAt) {
        message.textContent =
          'تسنّى 5 دقايق قبل ما تطلب رابطاً آخر.';
        return;
      }

      button.disabled = true;
      message.textContent = 'جاري معالجة الطلب...';

      try {
        const response = await fetch('/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: document.getElementById('email').value.trim()
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'تعذر معالجة الطلب.');
        }

        retryAt = Date.now() + 5 * 60 * 1000;
        message.textContent = data.message +
          ' الرابط صالح لمدة 15 دقيقة. إلا ما وصلاتكش الرسالة، تسنّى 5 دقايق قبل طلب رابط آخر.';
      } catch (error) {
        message.textContent =
          error.message || 'تعذر الاتصال بالسيرفر. عاود المحاولة.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
